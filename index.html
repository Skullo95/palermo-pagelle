<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schermata Viaggio Attivo</title>
    <style>
        /* --- Stile Generale --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; /* Un font simile */
        }

        body {
            background-color: #008f00; /* Il verde dello sfondo */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Contenitore Principale (lo schermo) --- */
        .app-container {
            width: 380px; /* Misura approssimativa di uno smartphone */
            height: 700px; /* Misura approssimativa */
            background-color: #008f00; /* Stesso verde */
            padding: 20px;
            position: relative; /* Per posizionare la 'X' */
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spazio tra i moduli */
            border-radius: 10px; /* Bordi leggermente arrotondati */
            overflow: hidden; /* Taglia i contenuti in eccesso */
        }

        /* --- Bottone Chiudi (X) --- */
        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        /* --- Titolo e Contatore --- */
        .header-title {
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .count-number {
            font-size: 18px;
            font-weight: bold;
        }

        /* --- Effetto Scorrimento --- */
        .scrolling-digits {
            display: inline-flex;
            overflow: hidden;
            height: 1.2em;
        }

        .scrolling-digit {
            position: relative;
            transform: translateY(0%);
            transition: transform 0.2s ease; /* Fluidità dello scorrimento */
        }

        .next-digit-number {
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* --- Stile dei Moduli (Carte Bianche) --- */
        .module-card {
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-info {
            font-weight: bold;
        }

        .user-id {
            font-size: 16px;
        }

        /* --- Modulo Dettagli Viaggio --- */
        .trip-details {
            gap: 10px;
        }

        .route-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .r-badge {
            background-color: #333;
            color: white;
            padding: 5px;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
        }

        .route-description {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
        }

        /* --- Label e Testo fisso --- */
        .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        .detail-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* --- Bottone Controlla Validità --- */
        .check-button {
            background-color: #0077c2; /* Il blu del bottone */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            align-self: center; /* Centra il bottone */
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Bottone Chiudi -->
        <span class="close-button">×</span>

        <!-- Titolo Viaggio con Contatore Progressivo -->
        <div class="header-title">
            <span class="label">Viaggio attivo</span>
            <div class="timer-container">
                <span class="count-number">0:00:</span>
                <!-- L'effetto di scorrimento qui -->
                <div class="scrolling-digits" id="timer-scroller">
                    <span class="scrolling-digit" id="scrolling-digit">
                        35
                        <span class="next-digit-number" id="next-scrolling-digit">36</span>
                    </span>
                </span>
            </div>
        </div>

        <!-- Primo Modulo: Info Utente -->
        <div class="module-card">
            <p class="user-info">Simone Ferranti</p>
            <p class="user-id">800028026947</p>
        </div>

        <!-- Secondo Modulo: Dettagli Viaggio -->
        <div class="module-card trip-details">
            <div class="route-info">
                <div class="r-badge">R</div>
                <p class="label">Collegamento</p>
            </div>
            <p class="route-description">Stazione di Merano –<br>Stazione di Bolzano Sud - Fiera</p>
            
            <div class="detail-block">
                <p class="label">Data</p>
                <p class="detail-text">11.05.2026</p>
            </div>

            <div class="detail-block">
                <p class="label">Orario</p>
                <p class="detail-text">08:16–08:51</p>
            </div>

            <!-- Bottone Controlla Validità -->
            <button class="check-button">Controlla validità</button>
        </div>
    </div>

    <!-- Script per l'animazione del contatore -->
    <script>
        // Stato del timer
        let currentSeconds = 35; // Partiamo da 0:00:35 come nell'immagine

        // Elementi DOM
        const scroller = document.getElementById('timer-scroller');
        const digitSpan = document.getElementById('scrolling-digit');
        const nextDigitSpan = document.getElementById('next-scrolling-digit');

        // Funzione per aggiornare il timer e l'animazione
        function updateCounter() {
            // Calcola il prossimo secondo
            let nextSeconds = (currentSeconds + 1) % 60; // Cicla da 0 a 59

            // Prepara il prossimo numero come stringa
            let nextSecondsStr = String(nextSeconds).padStart(2, '0');
            nextDigitSpan.innerText = nextSecondsStr;

            // Triggera l'animazione di scorrimento
            scroller.classList.add('is-animating');

            // Imposta lo stato finale dopo l'animazione
            setTimeout(() => {
                currentSeconds = nextSeconds;
                digitSpan.childNodes[0].nodeValue = nextSecondsStr; // Aggiorna il testo principale
                scroller.classList.remove('is-animating'); // Reset per la prossima animazione
            }, 200); // Durata dell'animazione CSS
        }

        // Imposta l'intervallo ogni secondo
        setInterval(updateCounter, 1000);
    </script>
</body>
</html>
