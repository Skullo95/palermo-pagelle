<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Viaggio Attivo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --green-bg: #1e7e34;
      --green-dark: #185f28;
      --white: #ffffff;
      --gray-label: #9e9e9e;
      --text-dark: #1a1a1a;
      --blue-btn: #2d6bb5;
      --blue-btn-hover: #245a9e;
      --card-radius: 12px;
      --badge-size: 38px;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Noto Sans', sans-serif;
      background: var(--green-bg);
      overflow-x: hidden;
    }

    .screen {
      min-height: 100dvh;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--green-bg);
      display: flex;
      flex-direction: column;
      padding: 0 0 28px 0;
      position: relative;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 18px 22px 22px;
    }

    .header-title {
      color: var(--white);
      font-size: clamp(22px, 6.5vw, 28px);
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.15;
      padding-top: 4px;
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      margin-top: -2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
    }
    .close-btn:active { opacity: 0.6; }
    .close-btn svg {
      width: 28px;
      height: 28px;
      fill: var(--white);
    }

    /* ── CARDS AREA ── */
    .cards-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 14px;
    }

    /* ── PASSENGER CARD ── */
    .card {
      background: var(--white);
      border-radius: var(--card-radius);
      padding: 20px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    .passenger-card .passenger-name {
      font-size: clamp(19px, 5.5vw, 23px);
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.2px;
      line-height: 1.25;
    }

    .passenger-card .passenger-code {
      font-size: clamp(17px, 5vw, 21px);
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* ── TICKET CARD ── */
    .ticket-card {
      padding: 20px 20px 22px 20px;
    }

    .train-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--badge-size);
      height: var(--badge-size);
      background: #2b2b2b;
      border-radius: 6px;
      color: var(--white);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 16px;
    }

    .field-group {
      margin-bottom: 16px;
    }
    .field-group:last-of-type {
      margin-bottom: 22px;
    }

    .field-label {
      font-size: clamp(12px, 3.5vw, 14px);
      font-weight: 500;
      color: var(--gray-label);
      margin-bottom: 3px;
      letter-spacing: 0.1px;
    }

    .field-value {
      font-size: clamp(21px, 6.2vw, 26px);
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .field-value.small {
      font-size: clamp(17px, 5vw, 21px);
    }

    /* ── BUTTON ── */
    .btn-container {
      display: flex;
      justify-content: center;
    }

    .check-btn {
      background: var(--blue-btn);
      color: var(--white);
      border: none;
      border-radius: 50px;
      padding: 15px 36px;
      font-family: 'Noto Sans', sans-serif;
      font-size: clamp(15px, 4.5vw, 17px);
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.1px;
      transition: background 0.18s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(45, 107, 181, 0.35);
    }
    .check-btn:active {
      background: var(--blue-btn-hover);
      transform: scale(0.97);
    }

    /* ── Divider line inside ticket card ── */
    .divider {
      width: 100%;
      height: 1px;
      background: #ebebeb;
      margin: 0 0 16px 0;
    }
  </style>
</head>
<body>
  <div class="screen">

    <!-- Header -->
    <div class="header">
      <h1 class="header-title">Viaggio attivo <span id="timer">0:00:00</span></h1>
      <button class="close-btn" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"/>
        </svg>
      </button>
    </div>

    <!-- Cards -->
    <div class="cards-area">

      <!-- Passenger card -->
      <div class="card passenger-card">
        <div class="passenger-name">Simone Ferranti</div>
        <div class="passenger-code">800028026947</div>
      </div>

      <!-- Ticket card -->
      <div class="card ticket-card">
        <div class="train-badge">R</div>

        <div class="field-group">
          <div class="field-label">Collegamento</div>
          <div class="field-value">Stazione di Merano – Stazione di Bolzano Sud - Fiera</div>
        </div>

        <div class="divider"></div>

        <div class="field-group">
          <div class="field-label">Data</div>
          <div class="field-value small">11.05.2026</div>
        </div>

        <div class="field-group">
          <div class="field-label">Orario</div>
          <div class="field-value small">08:16–08:51</div>
        </div>

        <div class="btn-container">
          <button class="check-btn">Controlla validità</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Starts at 0:00:35 as in the screenshot, then counts up
    let totalSeconds = 35;

    function formatTime(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(sec).padStart(2, '0');
      return `${h}:${mm}:${ss}`;
    }

    const timerEl = document.getElementById('timer');

    function tick() {
      timerEl.textContent = formatTime(totalSeconds);
      totalSeconds++;
    }

    tick(); // render immediately
    setInterval(tick, 1000);
  </script>
</body>
</html>
