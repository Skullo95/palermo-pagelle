<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Biglietto Digitale - Ottimizzato Oppo</title>
    <style>
        :root {
            --primary-green: #008f00;
            --btn-blue: #0077c2;
            --card-white: #ffffff;
            --safe-top: env(safe-area-inset-top, 40px); /* Gestione Notch/Punch-hole */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--primary-green);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100dvh; /* Altezza dinamica per schermi lunghi */
            overflow: hidden;
        }

        /* --- Container Principale ottimizzato per 20:9 --- */
        .app-shell {
            width: 100%;
            max-width: 500px; /* Limite per non sgranare su tablet */
            height: 100dvh;
            padding: var(--safe-top) 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .close-x {
            position: absolute;
            top: var(--safe-top);
            right: 20px;
            font-size: 28px;
            color: white;
            font-weight: 200;
        }

        /* --- Header con Timer --- */
        .header {
            margin-top: 10px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* --- Animazione Rolling Counter --- */
        .timer-box {
            display: flex;
            align-items: center;
        }

        .rolling-container {
            height: 1.2em;
            overflow: hidden;
            line-height: 1.2em;
            position: relative;
        }

        .rolling-list {
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        /* --- Card Bianche --- */
        .card {
            background: var(--card-white);
            border-radius: 16px; /* Bordi più morbidi stile moderno Android */
            padding: 22px;
            color: black;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .user-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
        .user-code { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.5px; }

        .label { color: #707070; font-size: 0.85rem; margin-bottom: 4px; display: block; }
        .info-bold { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }

        .route-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
        .badge-r {
            background: #333;
            color: white;
            min-width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .spacer { margin-top: 18px; }

        /* --- Bottone Blu --- */
        .btn-check {
            background-color: var(--btn-blue);
            color: white;
            border: none;
            width: 100%;
            max-width: 280px;
            padding: 14px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            margin: 25px auto 10px auto;
            display: block;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-check:active { transform: scale(0.98); }

    </style>
</head>
<body>

<div class="app-shell">
    <div class="close-x">✕</div>

    <div class="header">
        Viaggio attivo 0:00:
        <div class="timer-box">
            <div class="rolling-container">
                <div class="rolling-list" id="seconds-list">
                    <div id="sec-current">35</div>
                    <div id="sec-next">36</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Card 1 -->
    <div class="card">
        <div class="user-name">Simone Ferranti</div>
        <div class="user-code">800028026947</div>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <div class="route-row">
            <div class="badge-r">R</div>
            <div>
                <span class="label">Collegamento</span>
                <div class="info-bold">Stazione di Merano –<br>Stazione di Bolzano Sud - Fiera</div>
            </div>
        </div>

        <div class="spacer">
            <span class="label">Data</span>
            <div class="info-bold">11.05.2026</div>
        </div>

        <div class="spacer">
            <span class="label">Orario</span>
            <div class="info-bold">08:16–08:51</div>
        </div>

        <button class="btn-check">Controlla validità</button>
    </div>
</div>

<script>
    let currentSec = 35;
    const list = document.getElementById('seconds-list');
    const currentEl = document.getElementById('sec-current');
    const nextEl = document.getElementById('sec-next');

    function updateTimer() {
        // Prepariamo il prossimo numero
        let nextSec = (currentSec + 1) % 60;
        nextEl.innerText = nextSec.toString().padStart(2, '0');

        // Eseguiamo lo scorrimento verso l'alto
        list.style.transform = "translateY(-50%)";

        setTimeout(() => {
            // Reset istantaneo della posizione e aggiornamento numeri
            list.style.transition = "none";
            list.style.transform = "translateY(0)";
            currentSec = nextSec;
            currentEl.innerText = currentSec.toString().padStart(2, '0');
            
            // Forziamo il reflow per riattivare la transizione
            void list.offsetHeight; 
            list.style.transition = "transform 0.3s cubic-bezier(0.45, 0.05, 0.55, 0.95)";
        }, 300);
    }

    setInterval(updateTimer, 1000);
</script>

</body>
</html>
